[project]
name = "zammad-ai-index"
version = "0.4.4"
description = "Indexing job for Zammad AI"
readme = "README.md"
requires-python = "==3.14.10"
authors = [
    { name = "freinold", email = "fabian.reinold@muenchen.de" },
    { name = "nharbig", email = "nico.harbig@muenchen.de" },
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [{ name = "pilitz", email = "paul.ilitz@muenchen.de" }]
dependencies = [
    "fastembed==0.9.1",
    "feedparser==6.0.14",
    "langchain==1.4.7",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.3",
    "markdownify==1.2.3",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "socksio==1.0.0",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "truststore==0.10.5",
    "qdrant-client==1.20.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "ty==0.0.95"
]
xberg = [
    "langchain-xberg==1.3.8",
    "xberg==1.3.9"
]

[tool.semantic_release]
tag_format = "zammad-ai-index-{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
