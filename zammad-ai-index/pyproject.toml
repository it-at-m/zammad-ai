[project]
name = "zammad-ai-index"
version = "0.1.0"
description = "Indexing job for Zammad AI"
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
    "feedparser==6.0.12",
    "langchain==1.2.15",
    "langchain-core==1.3.0",
    "langchain-openai==1.1.11",
    "langchain-qdrant==1.1.0",
    "markdownify>=1.2.2",
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "socksio>=1.0.0",
    "stamina==25.2.0",
    "truststore==0.10.4",
]

[dependency-groups]
dev = ["pre-commit==4.6.0", "ruff==0.15.11", "ty==0.0.32"]
kreuzberg = ["langchain-kreuzberg==1.0.2", "kreuzberg==4.9.2"]
