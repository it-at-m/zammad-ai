version: 1
formatters:
  plain:
    (): job.utils.logging.build_plain_formatter
  json:
    (): job.utils.logging.build_json_formatter
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: json
    stream: ext://sys.stdout
  httpx:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stderr
loggers:
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: no
  dev:
    level: DEBUG
    handlers: [console]
    propagate: no
  zammad-ai-index:
    level: DEBUG
    propagate: yes
  faststream:
    level: INFO
    handlers: [console]
    propagate: no
  httpx:
    level: WARNING
    handlers: [httpx]
    propagate: no
  httpcore:
    level: WARNING
    handlers: [httpx]
    propagate: no
  httpcore2:
    level: WARNING
    handlers: [httpx]
    propagate: no
  openai:
    level: WARNING
    handlers: [httpx]
    propagate: no
root:
  level: DEBUG
  handlers: [console]
