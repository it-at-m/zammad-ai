version: 1
formatters:
  plain:
    (): guardrail_app.utils.logging.build_plain_formatter
  json:
    (): guardrail_app.utils.logging.build_json_formatter
handlers:
  console:
    class: logging.StreamHandler
    formatter: plain
    stream: ext://sys.stdout
loggers:
  slm-guardrails:
    level: INFO
    handlers: [console]
    propagate: false
root:
  level: INFO
  handlers: [console]
