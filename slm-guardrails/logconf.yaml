version: 1
formatters:
  plain:
    (): guardrail_app.utils.logging.build_plain_formatter
  json:
    (): guardrail_app.utils.logging.build_json_formatter
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: plain
    filters:
      - health_filter
    stream: ext://sys.stdout
  httpx:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stderr
filters:
  health_filter:
    (): guardrail_app.utils.logging.HealthFilter
loggers:
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: no
  slm-guardrails:
    level: INFO
    handlers: [console]
    propagate: false
  httpcore2:
    level: WARNING
    handlers: [httpx]
    propagate: no
root:
  level: INFO
  handlers: [console]
