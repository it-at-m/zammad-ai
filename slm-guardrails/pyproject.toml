[project]
name = "slm-guardrails"
license = "MIT"
version = "1.0.5"

description = "Content safety guardrail service for Zammad AI (FastAPI)"
readme = "README.md"
requires-python = "==3.14.7"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]

dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "structlog==26.1.0",
    "truststore==0.10.4",
    "uvicorn==0.52.4",
    "prometheus_client==0.26.0",
    "gliner2==2.0.0",
    "gliclass==0.1.20",
    "torch==2.14.0",
    "transformers==5.16.1",
    "setuptools==84.0.0",
    "peft==0.20.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.6", "ty==0.0.78"]

[tool.uv]
add-bounds = "exact"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
