[project]
name = "slm-guardrails"
license = "MIT"
version = "1.0.5"

description = "Content safety guardrail service for Zammad AI (FastAPI)"
readme = "README.md"
requires-python = "==3.14.8"
authors = [
    { name = "freinold", email = "fabian.reinold@muenchen.de" },
    { name = "nharbig", email = "nico.harbig@muenchen.de" },
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]

dependencies = [
    "fastapi==0.151.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "structlog==26.1.0",
    "truststore==0.10.5",
    "uvicorn==0.54.0",
    "prometheus_client==0.26.0",
    "gliner2==2.1.0",
    "gliclass==0.1.21",
    "torch==2.14.1+cpu; sys_platform == 'linux'",
    "transformers==5.20.2",
    "setuptools==84.2.0",
    "peft==0.21.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1", "ty==0.0.89"]

[tool.uv]
add-bounds = "exact"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
