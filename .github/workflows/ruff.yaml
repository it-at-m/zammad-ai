name: Ruff
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.all.outputs.modules || steps.matrix.outputs.modules }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Run on push to main
        id: all
        if: github.event_name == 'push'
        run: echo 'modules=["./zammad-ai-workflow", "./zammad-ai-index", "./slm-guardrails"]' >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed subprojects
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            workflow:
              - 'zammad-ai-workflow/**'
              - 'ruff.toml'
              - '.github/workflows/ruff.yaml'
            index:
              - 'zammad-ai-index/**'
              - 'ruff.toml'
              - '.github/workflows/ruff.yaml'
            guardrails:
              - 'slm-guardrails/**'
              - 'ruff.toml'
              - '.github/workflows/ruff.yaml'

      - name: Build module matrix
        id: matrix
        if: github.event_name == 'pull_request'
        run: |
          modules=$(jq -nc --arg w "${{ steps.filter.outputs.workflow }}" --arg i "${{ steps.filter.outputs.index }}" --arg g "${{ steps.filter.outputs.guardrails }}" \
            '[[$w, "./zammad-ai-workflow"], [$i, "./zammad-ai-index"], [$g, "./slm-guardrails"]] | map(select(.[0] == "true") | .[1])')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  ruff:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
