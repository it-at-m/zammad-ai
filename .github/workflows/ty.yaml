name: Type check with ty
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ty:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - ./zammad-ai-workflow
          - ./zammad-ai-index
          - ./slm-guardrails
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: ${{ matrix.working-directory }}
        run: |
          uv python install
      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: |
          if [ "${{ matrix.working-directory }}" = "./slm-guardrails" ]; then
            uv sync --locked --all-extras
          else
            uv sync --locked --all-extras --group kreuzberg
          fi

      - name: Run ty check
        working-directory: ${{ matrix.working-directory }}
        run: |
          uv run ty check --output-format github
