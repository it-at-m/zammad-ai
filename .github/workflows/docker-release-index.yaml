name: Build and Release Index Docker Image

on:
  push:
    tags:
      - "zammad-ai-index-*" # Triggers only on zammad-ai-index tags
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      tag:
        description: "Core tag to release (e.g., zammad-ai-index-1.0.0)"
        required: true
        default: "zammad-ai-index-latest"

jobs:
  build-and-push-core-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from zammad-ai-index tag
        id: vars
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FULL_TAG="$MANUAL_TAG"
          else
            FULL_TAG=${GITHUB_REF#refs/tags/}
          fi

          # Extract version from zammad-ai-index-* tag (e.g., zammad-ai-index-1.0.0 -> 1.0.0)
          if [[ "$FULL_TAG" =~ ^zammad-ai-index-(.+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Error: Tag must start with 'zammad-ai-index-'"
            exit 1
          fi

          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Set build timestamp
        id: build_ts
        run: echo "BUILD_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push zammad-ai Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./zammad-ai-index
          file: ./zammad-ai-index/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/zammad-ai-index:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/zammad-ai-index:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_CREATED=${{ github.event.repository.pushed_at || env.BUILD_TS }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.vars.outputs.version }}
      - name: Image digest
        run: |
          echo "zammad-ai-index image built and pushed:"
          echo "  ghcr.io/${{ github.repository }}/zammad-ai-index:${{ steps.vars.outputs.version }}"
          echo "  ghcr.io/${{ github.repository }}/zammad-ai-index:latest"
