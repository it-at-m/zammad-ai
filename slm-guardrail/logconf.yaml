version: 1
formatters:
  simple:
    format: '%(levelname)s %(name)s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
loggers:
  slm-guardrail:
    level: INFO
    handlers: [console]
    propagate: false
root:
  level: INFO
  handlers: [console]
