# ============================================================================
# Zammad-AI Configuration Template
# ============================================================================
# Copy this file to config.yaml and adjust values for your use case
#
# IMPORTANT: Secrets (API keys, tokens) should be set in .env file, not here!
# See .env.example for required environment variables
#
# Configuration hierarchy (highest priority first):
#   1. CLI arguments
#   2. Environment variables (prefix: ZAMMAD_AI_)
#   3. .env file
#   4. This YAML file (config.yaml)
# ============================================================================

# ============================================================================
# Use Case Configuration
# ============================================================================
usecase:
  name: "my_usecase"
  description: "Description of your use case"

# ============================================================================
# GenAI Configuration
# ============================================================================
genai:
  sdk: "openai" # Currently only "openai" is supported
  max_retries: 3 # Maximum number of retries for API calls
  chat_model: "gpt-4.1-mini" # Model for chat completions
  triage_model: null # Optional override for triage model (fallback: chat_model)
  answer_model: null # Optional override for answer model (fallback: chat_model)
  judge_model: "gpt-4.1-mini" # Model for triage judgment (can be same as chat_model)
  embedding_model: "text-embedding-3-large" # Model for embeddings
  # Migration note:
  # - old `temperature` -> use `triage_temperature` / `answer_temperature` / `judge_temperature`
  # - old `reasoning_effort` -> use `triage_reasoning_effort` / `answer_reasoning_effort` / `judge_reasoning_effort`
  # Ensure you set all role-specific values explicitly when upgrading existing configs.
  triage_reasoning_effort: null # Options: "minimal", "low", "medium", "high", or null
  answer_reasoning_effort: null # Options: "minimal", "low", "medium", "high", or null
  judge_reasoning_effort: null # Options: "minimal", "low", "medium", "high", or null
  triage_temperature: 0.0 # Temperature for chat completions (0.0 = deterministic)
  answer_temperature: 0.0 # Temperature for chat completions (0.0 = deterministic)
  judge_temperature: 0.0 # Temperature for chat completions (0.0 = deterministic)

# Note: OpenAI SDK requires environment variables (set in .env):
#   OPENAI_API_KEY (required)
#   OPENAI_BASE_URL (optional, for custom endpoints/proxies)

# ============================================================================
# Zammad Configuration
# ============================================================================
# Set secrets in .env file:
#   ZAMMAD_AI_ZAMMAD__AUTH_TOKEN (required for type: "api")
#   ZAMMAD_AI_ZAMMAD__RSS_FEED_TOKEN (optional for type: "api")
#   ZAMMAD_AI_ZAMMAD__OAUTH2_CLIENT_SECRET (required for type: "eai")

zammad:
  type: "api" # Options: "api" or "eai"

  # For type: "api"
  base_url: "https://your-zammad-instance.example.com"
  knowledge_base_id: "1" # Optional: set to null to disable knowledge base
  timeout: 30 # Request timeout in seconds
  max_retries: 3 # Maximum number of retries for API calls
  http_proxy_url: null # Optional: proxy URL for routing requests (e.g. "http://proxy.example.com:8080")
  # auth_token is required for type "api" and should be provided via:
  # ZAMMAD_AI_ZAMMAD__AUTH_TOKEN
  # rss_feed_token is optional and should be provided via:
  # ZAMMAD_AI_ZAMMAD__RSS_FEED_TOKEN
  document_parsing:
    mode: "off" # Options: "off" (no document parsing), "local" (parse documents locally), "remote" (use external document parsing service)
    url: null # Optional: URL of document parsing service (e.g. "https://kreuzberg.example.com"), if null, document parsing is used locally without calling an external service
    http_proxy_url: null # Optional: proxy URL for routing requests to the document parsing service (e.g. "http://proxy.example.com:8080")

  # For type: "eai" (alternative to "api"), use these instead:
  # eai_url: "https://your-zammad-eai.example.com/api/v1"
  # knowledge_base_id: "1"
  # timeout: 30
  # max_retries: 3
  # http_proxy_url: null
  # oauth2_client_id: "your-client-id"
  # oauth2_token_url: "https://your-zammad-eai.example.com/oauth/token"
  # oauth2_scope: null # Optional: OAuth 2.0 scope

# ============================================================================
# Answer Configuration
# ============================================================================
# Set secret in .env file:
#   ZAMMAD_AI_ANSWER__QDRANT__API_KEY (required)
answer:
  agent_prompt:
    type: "file" # Options: "string", "file", "langfuse"
    prompt: "prompts/answer/agent.prompt.md"
  qdrant:
    url: "https://your-qdrant-instance.example.com"
    api_key: null # Set in .env: ZAMMAD_AI_ANSWER__QDRANT__API_KEY
    collection_name: "your-collection-name"
    vector_name: null # Optional: name of the vector field in Qdrant
    vector_dimension: 1024
    timeout: 60 # Request timeout in seconds
    retrieval_num_documents: 5 # Number of documents to retrieve from Qdrant for context
  dlf:
    url: "https://your-dlf-backend.example.com/api"
    filter_categories: [] # Optional: list of categories to filter DLF results, or null for no filtering
    timeout: 60 # Request timeout in seconds
    max_retries: 2 # Maximum number of retries for DLF API calls
  judge:
    enabled: false # Set to true to enable LLM judge checks after answer generation
    thresholds:
      context_relevance: 0.75
      groundedness: 0.75
      answer_relevance: 0.75
    prompt:
      type: "file" # Options: "string", "file", "langfuse"
      prompt: "prompts/judge/judge.prompt.md"
    repair_prompt:
      type: "file" # Options: "string", "file", "langfuse"
      prompt: "prompts/answer/repair.prompt.md"
    max_repairs: 0
  ai_answer_disclaimer: "" # Optional: disclaimer text for AI-generated answers

# ============================================================================
# Kafka Configuration
# ============================================================================
# For local development with docker compose, use broker_url: "localhost:29092"
# For production or direct docker network access, use "kafka:9092"
kafka:
  broker_url: "localhost:29092" # Kafka broker URL (compose stack)
  topic: "ticket-events" # Kafka topic to consume from
  client_id: "zammad-ai" # Kafka client ID shown as the consumer name
  group_id: null # Consumer group ID (defaults to null)

  # mTLS Security Configuration (optional)
  # Option 1: File-based mTLS (type: "file")
  # security:
  #   type: "file"
  #   ca_file_path: "/path/to/ca.pem"
  #   client_cert_path: "/path/to/client.pem"
  #   client_key_path: "/path/to/client.key"

  # Option 2: Environment/base64-encoded mTLS (type: "env")
  # Recommended: set values via ZAMMAD_AI_KAFKA__SECURITY__* environment variables
  # security:
  #   type: "env"
  #   ca_file_base64: "<base64-encoded CA cert>"
  #   pkcs12_base64: "<base64-encoded PKCS#12 payload>"
  #   pkcs12_pw_base64: "<base64-encoded PKCS#12 password>"

  security: null

# ============================================================================
# Valid Request Types
# ============================================================================
# List of request types that should be processed by the application
valid_request_types:
  - "example_request_type"

# Maximum combined article and attachment text length accepted for triage/answer processing.
max_user_text_length: 2000

# ============================================================================
# Triage Configuration
# ============================================================================
triage:
  # Category setup: Define the categories for ticket classification
  # Each category requires only a unique name.
  categories:
    - name: "General Questions"
      auto_publish: true # Optional: automatically publish AI response for this category
    - name: "Status Inquiries"
      auto_publish: false # Optional: do not automatically publish AI response for this category. Post Shared Draft instead for manual review.
    - name: "Cannot Categorize"
      auto_publish: false

  # Fallback category name when classification fails (must match a category name above)
  no_category_name: "Cannot Categorize"

  # Action setup: Define automated actions
  # type options: "AIAnswer" (generate AI response), "NoAction" (do nothing), "StaticAnswer" (post predefined answer)
  # answer: optional static answer text (used with type "StaticAnswer")
  actions:
    - name: "no_action"
      description: "No automated action"
      type: "NoAction"
    - name: "ai_response"
      description: "Generate AI-powered response"
      type: "AIAnswer"

  # Fallback action name when no rule matches (must match an action name above)
  no_action_name: "no_action"

  # Action rules: Define when to trigger specific actions
  # category_name and action_name must match names defined above
  action_rules:
    # Example: Always generate AI response for "General Questions"
    - category_name: "General Questions"
      action_name: "ai_response"

    # Example: Conditional action based on conditions
    - category_name: "Status Inquiries"
      action_name: "no_action" # Default action when no condition matches
      conditions:
        - priority: 1
          field: "days_since_request" # Options: "processing_id", "days_since_request"
          operator: "less" # Options: "equals", "not_equals", "less", "less_equals", "greater", "greater_equals"
          value: 30
          action_name: "ai_response"
        - priority: 2
          field: "days_since_request"
          operator: "greater_equals"
          value: 30
          action_name: "no_action"

  # Prompt configuration
  prompts:
    type: "langfuse" # Options: "langfuse", "string", or "file"
    prompt_map:
      categories:
        label: "latest" # Prompt version label
        name: "your-usecase/categories" # Prompt name in Langfuse
      examples:
        label: "latest"
        name: "your-usecase/examples"
      role:
        label: "latest"
        name: "your-usecase/role"

    # For type: "string" (inline prompts), use:
    # type: "string"
    # prompt_map:
    #   categories: "Your inline categories prompt..."
    #   examples: "Your inline examples prompt..."
    #   role: "Your inline role prompt..."

    # For type: "file" (prompts from files), use:
    # type: "file"
    # prompt_map:
    #   categories: "/path/to/categories.txt"
    #   examples: "/path/to/examples.txt"
    #   role: "/path/to/role.txt"

# ============================================================================
# Optional Settings
# ============================================================================

# Frontend settings (optional web interface)
frontend:
  enabled: false # Set to true to mount Gradio UI at '/'
  request_timeout_seconds: 30.0 # API timeout for frontend requests
  auth_username: "demo" # Basic auth username for local development
  auth_password: "zammad-ai" # Basic auth password for local development

# Logging configuration
log:
  format: "json" # Options: "json", "plain"
  # Default: "plain" for development mode, "json" for production mode
  # "json": Structured JSON logs for production/log aggregation
  # "plain": Human-readable logs for development/debugging

  level: "INFO" # Options: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
  # Default: "DEBUG" for development mode, "INFO" for production mode
  # Applies to the zammad-ai logger only
  # "DEBUG": Most verbose, logs everything
  # "INFO": Standard information messages
  # "WARNING": Warnings and errors
  # "ERROR": Errors only
  # "CRITICAL": Critical errors only

# Langfuse integration toggle
langfuse_enabled: true # Set to false to disable Langfuse integration

# Application mode
mode: "production" # Options: "production", "development", "unittest"

# Prometheus metrics configuration
prometheus:
  enabled: true # Set to true to enable Prometheus metrics endpoint
  port: 9090 # Port for Prometheus metrics server
