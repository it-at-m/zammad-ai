[project]
name = "zammad-ai"
license = "MIT"
version = "0.0.0"
description = "GenAI-powered agent for Zammad"
readme = "README.md"
requires-python = "==3.14.4"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]

dependencies = [
    "cryptography==46.0.7",
    "fastapi==0.136.0",
    "faststream[cli,kafka,prometheus]==0.6.7",
    "feedparser==6.0.12",
    "gradio==6.13.0",
    "httpx[socks]==0.28.1",
    "langchain-core==1.3.0",
    "langchain-openai==1.1.14",
    "langchain-qdrant==1.1.0",
    "langchain==1.2.15",
    "langfuse==4.3.1",
    "markdownify==1.2.2",
    "openai==2.32.0",
    "pandas==3.0.2",
    "pydantic-settings==2.14.0",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "stamina==26.1.0",
    "truststore==0.10.4",
    "uvicorn==0.44.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "pre-commit==4.5.1",
    "pytest-asyncio==1.3.0",
    "pytest==9.0.3",
    "ruff==0.15.11",
    "ty==0.0.32",
]
kreuzberg = ["langchain-kreuzberg==1.0.2", "kreuzberg==4.9.2"]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
