[project]
name = "zammad-ai-workflow"
license = "MIT"

version = "0.4.1"

description = "GenAI-powered agent for Zammad"
readme = "README.md"
requires-python = "==3.14.7"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]

dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "faststream[cli,kafka,prometheus]==0.7.5",
    "feedparser==6.0.14",
    "gradio==6.26.0",
    "httpx[socks]==0.28.1",
    "jinja2==3.1.6",
    "langchain-core==1.6.0",
    "langchain-openai==1.6.0",
    "langchain-qdrant==1.1.0",
    "langchain==1.3.17",
    "langchain-anthropic==1.6.1",
    "langfuse==4.14.5",
    "anthropic==1.4.0",
    "markdownify==1.2.3",
    "openai==3.5.0",
    "pandas==3.0.5",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "truststore==0.10.4",
    "uvicorn==0.52.4",
    "fastembed==0.8.0",
    "langchain-classic==1.0.8",
    "qdrant-client==1.19.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "pre-commit==4.6.2",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "ruff==0.16.4",
    "ty==0.0.75",
]
kreuzberg = ["langchain-kreuzberg==1.0.2", "kreuzberg==4.10.2"]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.semantic_release]
tag_format = "zammad-ai-workflow-{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
