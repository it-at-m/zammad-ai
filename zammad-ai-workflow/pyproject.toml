[project]
name = "zammad-ai-workflow"
license = "MIT"
version = "0.4.22"
description = "GenAI-powered agent for Zammad"
readme = "README.md"
requires-python = "==3.14.10"
authors = [
    { name = "freinold", email = "fabian.reinold@muenchen.de" },
    { name = "nharbig", email = "nico.harbig@muenchen.de" },
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]

dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "faststream[cli,kafka,prometheus]==0.7.8",
    "feedparser==6.0.14",
    "gradio==6.31.0",
    "httpx[socks]==0.28.1",
    "jinja2==3.1.6",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langchain-qdrant==1.1.0",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.7",
    "langfuse==4.18.0",
    "anthropic==2.3.0",
    "markdownify==1.2.3",
    "openai==3.42.1",
    "pandas==3.1.0",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "truststore==0.10.5",
    "uvicorn==0.54.0",
    "fastembed==0.9.1",
    "langchain-classic==1.0.8",
    "qdrant-client==1.20.0",
    "urllib3==2.8.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "pre-commit==4.7.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.95",
    "virtualenv==21.15.2",
]
xberg = [
    "langchain-xberg==1.3.8",
    "xberg==1.3.9"
]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.semantic_release]
tag_format = "zammad-ai-workflow-{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
