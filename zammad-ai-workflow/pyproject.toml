[project]
name = "zammad-ai"
license = "MIT"
version = "0.1.6"

description = "GenAI-powered agent for Zammad"
readme = "README.md"
requires-python = "==3.14.4"
authors = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
    { name = "Paul Ilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "Fabian Reinold", email = "fabian.reinold@muenchen.de" },
]

dependencies = [
    "cryptography==48.0.0",
    "fastapi==0.136.3",
    "faststream[cli,kafka,prometheus]==0.6.7",
    "feedparser==6.0.12",
    "gradio==6.15.1",
    "httpx[socks]==0.28.1",
    "jinja2==3.1.6",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.2",
    "langchain-qdrant==1.1.0",
    "langchain==1.3.2",
    "langfuse==4.6.1",
    "markdownify==1.2.2",
    "openai==2.38.0",
    "pandas==3.0.3",
    "pydantic-settings==2.14.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "stamina==26.1.0",
    "truststore==0.10.4",
    "uvicorn==0.48.0",
    "gliner2==1.3.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "pre-commit==4.6.0",
    "pytest-asyncio==1.4.0",
    "pytest==9.0.3",
    "ruff==0.15.14",
    "ty==0.0.40",
]
kreuzberg = ["langchain-kreuzberg==1.0.2", "kreuzberg==4.9.7"]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.semantic_release]
tag_format = "zammad-ai-workflow-{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
