[project]
name = "zammad-ai-workflow"
license = "MIT"

version = "0.4.20"

description = "GenAI-powered agent for Zammad"
readme = "README.md"
requires-python = "==3.14.8"
authors = [
    { name = "freinold", email = "fabian.reinold@muenchen.de" },
    { name = "nharbig", email = "nico.harbig@muenchen.de" },
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]
maintainers = [
    { name = "pilitz", email = "paul.ilitz@muenchen.de" },
]

dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "faststream[cli,kafka,prometheus]==0.7.7",
    "feedparser==6.0.14",
    "gradio==6.29.1",
    "httpx[socks]==0.28.1",
    "jinja2==3.1.6",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "langchain-qdrant==1.1.0",
    "langchain==1.4.3",
    "langchain-anthropic==1.7.5",
    "langfuse==4.17.0",
    "anthropic==1.11.0",
    "markdownify==1.2.3",
    "openai==3.24.0",
    "pandas==3.0.6",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "truststore==0.10.4",
    "uvicorn==0.54.0",
    "fastembed==0.8.1",
    "langchain-classic==1.0.8",
    "qdrant-client==1.19.1",
    "urllib3==2.8.0",
    "tornado==6.5.10",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "pre-commit==4.6.2",
    "pytest-asyncio==1.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "ty==0.0.84",
    "virtualenv==21.14.5",
]
kreuzberg = ["langchain-kreuzberg==1.0.2", "kreuzberg==4.10.4"]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.semantic_release]
tag_format = "zammad-ai-workflow-{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.publish]
upload_to_vcs_release = false
