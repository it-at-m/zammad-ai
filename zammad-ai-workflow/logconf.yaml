version: 1
formatters:
  plain:
    (): app.utils.logging.build_plain_formatter
  json:
    (): app.utils.logging.build_json_formatter
filters:
  metrics_filter:
    (): app.utils.logging.MetricsFilter
  health_filter:
    (): app.utils.logging.HealthFilter
  gradio_filter:
    (): app.utils.logging.GradioFilter
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: json
    filters:
      - metrics_filter
      - health_filter
      - gradio_filter
    stream: ext://sys.stdout
  httpx:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stderr
loggers:
  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: no
  dev:
    level: DEBUG
    handlers: [console]
    propagate: no
  zammad-ai:
    level: DEBUG
    propagate: yes
  faststream:
    level: INFO
    handlers: [console]
    propagate: no
  httpx:
    level: WARNING
    handlers: [httpx]
    propagate: no
  httpcore:
    level: WARNING
    handlers: [httpx]
    propagate: no
  PIL.Image:
    level: WARNING
    handlers: [console]
    propagate: no
  python_multipart.multipart:
    level: WARNING
    handlers: [console]
    propagate: no
  openai:
    level: WARNING
    handlers: [console]
    propagate: no
  anthropic:
    level: WARNING
    handlers: [console]
    propagate: no
root:
  level: DEBUG
  handlers: [console]
